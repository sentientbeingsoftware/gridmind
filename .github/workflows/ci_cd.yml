name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed for random-tap test and monkey'
        default: '42'
      events:
        description: 'Random-tap events'
        default: '500'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run Analysis
        run: flutter analyze
      - name: Run Tests
        run: flutter test

  build-android-linux-web:
    name: Build Android, Linux, & Web
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # libgstreamer*: required by the audioplayers_linux plugin at configure time
          sudo apt-get install -y libgtk-3-dev cmake ninja-build pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --dart-define=FEEDBACK_API_KEY=${{ secrets.FEEDBACK_API_KEY }} --dart-define=TELEMETRY_TOKEN=${{ secrets.TELEMETRY_TOKEN }}
      - name: Build Linux
        run: flutter build linux --dart-define=FEEDBACK_API_KEY=${{ secrets.FEEDBACK_API_KEY }} --dart-define=TELEMETRY_TOKEN=${{ secrets.TELEMETRY_TOKEN }}
      - name: Build Web
        run: flutter build web --dart-define=FEEDBACK_API_KEY=${{ secrets.FEEDBACK_API_KEY }} --dart-define=TELEMETRY_TOKEN=${{ secrets.TELEMETRY_TOKEN }}

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --dart-define=FEEDBACK_API_KEY=${{ secrets.FEEDBACK_API_KEY }} --dart-define=TELEMETRY_TOKEN=${{ secrets.TELEMETRY_TOKEN }}

  # Manual-only, not a required check. No secrets: the app runs with telemetry/feedback keys unset.
  stress-android:
    name: Stress (emulator)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install dependencies
        run: flutter pub get
      - name: Random-tap test + adb monkey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          # Any failure (exception, RenderFlex overflow, crash/ANR) exits non-zero and fails the job; details are in the job log.
          script: |
            flutter test integration_test/random_tap_test.dart --dart-define=SEED=${{ inputs.seed }} --dart-define=EVENTS=${{ inputs.events }}
            flutter build apk --debug
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            ./scripts/monkey.sh -p com.sentientbeingsoftware.gridmind -n 5000 -s ${{ inputs.seed }}
