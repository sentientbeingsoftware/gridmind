# GridMind - A collection of puzzle and memory games
# This Flutter application features three distinct games:
# 1. Simon Game - Memory pattern matching
# 2. Slide and Solve - Pattern rearrangement puzzle
# 3. Collapse - Match-3 style block clearing game
name: gridmind
description: "Twenty-two grid-based puzzle, memory and arcade mini-games."

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# Version and build number configuration
# Version format: major.minor.patch+build_number
# - major.minor.patch: Semantic versioning for features and fixes
# - build_number: Incremental build identifier
# 
# Platform-specific versioning:
# - Android: build-name = versionName, build-number = versionCode
# - iOS: build-name = CFBundleShortVersionString, build-number = CFBundleVersion
# - Windows: build-name = product/file version parts, build-number = build suffix
version: 1.0.0+8

# Dart SDK version requirement
# Ensures compatibility with Flutter framework features
environment:
  sdk: '>=3.0.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  # Core Flutter framework
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  
  # iOS-style icons for cross-platform consistency
  # Provides CupertinoIcons class for iOS-style iconography
  cupertino_icons: ^1.0.8
  
  # URL launcher for opening external links
  # Used in settings screen to open support/donation links
  url_launcher: ^6.3.3
  http: ^1.6.0
  audioplayers: ^6.8.1
  vibration: ^3.2.1

# Development dependencies - only needed during development
dev_dependencies:
  # Flutter testing framework
  flutter_test:
    sdk: flutter

  # Code quality and linting rules
  # The "flutter_lints" package contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Used by test/privacy_policy_link_test.dart to fake the URL launcher.
  # Already resolved transitively via url_launcher; declared to satisfy the lint.
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2
  
  # App icon generation tool
  # Automatically generates platform-specific app icons from a single image
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# Flutter-specific configuration section
flutter:
  # Material Design icons font inclusion
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/sfx/

  # Asset configuration
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Custom font configuration
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Flutter Launcher Icons configuration
# Automatically generates app icons for all platforms from a single source image
flutter_launcher_icons:
  # Android icon configuration
  android: "launcher_icon" # Or true, or a specific flavor name
  
  # iOS icon configuration
  ios: true # Or a specific flavor name
  
  # Path to the source icon image (should be high resolution, e.g., 1024x1024)
  image_path: "assets/images/gridmind_android_icon.png"
  
  # Android adaptive icon configuration (Android 8.0+)
  # Background color or image for adaptive icons
  adaptive_icon_background: "#ffffff" # Color or path to an image
  
  # Foreground image for adaptive icons
  adaptive_icon_foreground: "assets/images/gridmind_android_icon.png"
