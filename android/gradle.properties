org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m
# org.gradle.java.home is auto-detected from JAVA_HOME (set by actions/setup-java in CI)
# org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
#
# CRITICAL (Windows + Android Studio): Android Studio's bundled JetBrains JDK 25
# causes a Kotlin DSL compiler crash: "java.lang.IllegalArgumentException: 25.0.3"
# This happens because Gradle 8.14.6's Kotlin compiler cannot parse Java 25 version strings.
#
# FIX (Windows only): Set JAVA_HOME to a JDK 17 or 21 installation before running flutter.
#   set JAVA_HOME=C:\path\to\jdk-17
#   flutter run
# JDK 17 was installed from Adoptium Temurin.
# NOTE: Do NOT hardcode org.gradle.java.home here — it breaks CI where JAVA_HOME
#       points to a different JDK path. Let Gradle auto-detect from JAVA_HOME.
#
# Disable Kotlin DSL compile avoidance to further avoid Kotlin compiler issues:
kotlin.compile.caching=false
kotlin.incremental=false
org.gradle.caching=false
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
org.gradle.logging.level=info
org.gradle.logging.file.enabled=true
org.gradle.daemon=true
android.newDsl=false
